name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub release.
# A manual run (Actions tab > Release > Run workflow) only builds and keeps the installers as run artifacts.
# With the TAURI_SIGNING_PRIVATE_KEY secret set, the build also signs update files and adds latest.json to the release.
# Without it, update files are skipped and the build works as before.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows
            os: windows-latest
            targets: ''
            args: --bundles nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # The oldest supported runner, so the build runs on older glibc too
          - name: linux
            os: ubuntu-22.04
            targets: ''
            args: --bundles deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Whiteout ${{ github.ref_name }}
          releaseBody: Unsigned builds. See the README for install notes.
          releaseDraft: true
          includeUpdaterJson: ${{ env.HAS_UPDATER_KEY == 'true' }}
          args: ${{ matrix.args }}${{ env.HAS_UPDATER_KEY != 'true' && ' --config src-tauri/tauri.no-updater.conf.json' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: whiteout-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
